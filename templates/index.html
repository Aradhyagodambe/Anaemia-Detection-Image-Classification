<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anemia Detection Model</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
        }
        /* Custom file input styling */
        input[type="file"]::file-selector-button {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-semibold text-gray-900 tracking-tight">Anemia Detection</h2>
            <p class="text-sm text-gray-500 mt-2">Upload a medical image for SVM classification.</p>
        </div>

        <form action="{{ url_for('predict') }}" method="post" enctype="multipart/form-data" class="space-y-6">
            
            <!-- File Upload Zone -->
            <label class="flex flex-col items-center justify-center w-full h-40 border-2 border-gray-200 border-dashed rounded-xl cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors">
                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                    <svg class="w-8 h-8 mb-3 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                    </svg>
                    <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Click to upload</span> or drag and drop</p>
                    <p class="text-xs text-gray-400">JPEG, PNG, or JPG (Max 16MB)</p>
                </div>
                <input type="file" name="file" class="hidden" accept="image/*" required onchange="document.getElementById('filename').textContent = this.files[0].name" />
            </label>
            <div id="filename" class="text-center text-xs text-gray-600 font-medium h-4"></div>

            <button type="submit" 
                class="w-full bg-gray-900 hover:bg-gray-800 text-white font-medium py-3 rounded-xl transition-colors duration-200 text-sm focus:ring-2 focus:ring-offset-2 focus:ring-gray-900 shadow-sm">
                Analyze Image
            </button>
        </form>

        <!-- Prediction Result -->
        {% if prediction %}
        <div class="mt-8 pt-6 border-t border-gray-100">
            <h3 class="text-sm font-medium text-gray-500 text-center uppercase tracking-wide mb-4">Analysis Result</h3>
            
            {% if img_url %}
            <div class="flex justify-center mb-4">
                <img src="{{ img_url }}" alt="Uploaded Image" class="w-24 h-24 object-cover rounded-lg border border-gray-200 shadow-sm">
            </div>
            {% endif %}

            <div class="p-4 rounded-xl border text-center font-semibold 
                {% if prediction == 'Anemic' %} bg-red-50 border-red-100 text-red-700 
                {% else %} bg-green-50 border-green-100 text-green-700 {% endif %}">
                {{ prediction }}
            </div>
        </div>
        {% endif %}

        <!-- Error Handling -->
        {% if error %}
        <div class="mt-6 p-4 bg-red-50 rounded-xl border border-red-100 text-center">
            <span class="text-red-700 font-medium text-sm">{{ error }}</span>
        </div>
        {% endif %}
    </div>

</body>
</html>
